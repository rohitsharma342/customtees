name: custom_tees
description: A customizable T-shirt e-commerce app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.0.3
  uuid: ^4.2.1
  flutter_cache_manager: ^3.3.1
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  http: ^1.1.0
  path: ^1.8.3
  crypto: ^3.0.3
  file: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true